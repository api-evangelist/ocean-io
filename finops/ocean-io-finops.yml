created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
# 2026-08-13: cost model corrected from the provider's own credit documentation at
# https://app.ocean.io/docs/getting-started/credits — Ocean.io meters API usage from a
# single credit pool with published per-endpoint rates, not a bundled seat contract.
method: derived
modified: '2026-08-13'
reconciled: true
tags:
- Sales Intelligence
