- FOCUS
description: >-
  FOCUS-aligned FinOps profile for Ocean.io. The cost driver is a single shared credit pool that
  every API endpoint draws from, with per-endpoint rates Ocean.io publishes: 0.2 credits per search
  result, 0.1 per enrichment, 0.05 per lookup, 1 per email revealed and 10 per phone revealed.
  Optimize by routing known domains through Lookup rather than Search (4x cheaper per result), by
  sizing searches with a size:1 probe before spending, by trimming responses with the fields
  parameter, and by treating phone reveal as the outlier line item it is at 10x the cost of an email.
  Monetary tier pricing is not published in a readable form — the marketing pricing page answers
  non-browser clients with a Cloudflare challenge — so unit economics are tracked in credits.
notes: Credit-pool metering with published per-unit rates; monetary tiers not publicly readable.
sources:
- https://app.ocean.io/docs/getting-started/credits
- https://app.ocean.io/docs/getting-started/best-practices
- https://ocean.io/
