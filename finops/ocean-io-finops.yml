alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Ocean.io
serviceCategory: Sales Intelligence
billingModel:
  pricingCategory: Usage-based
  billingFrequency: Unknown
  billingCurrency: USD
  chargeCategories:
  - Subscription
focusColumns:
  ServiceName: Ocean.io
  ServiceCategory: Sales Intelligence
  ProviderName: Ocean.io
  PublisherName: Ocean.io
  InvoiceIssuerName: Ocean.io
  BillingCurrency: USD
  ChargeCategory: Subscription
meters:
- name: api_credits
  description: >-
    Shared credit pool consumed by every endpoint. Published rates: search 0.2/result, enrich
    0.1/result, lookup 0.05/result, autocomplete 0.1/call, email reveal 1/email found, phone reveal
    10/phone found; data-fields, credit-balance and warmup are free.
  unit: credit
  aggregation: sum
  dimensions:
  - endpoint
- name: email_credits
  description: Separate email-credit balance returned by GET /v2/credits/balance.
  unit: credit
  aggregation: sum
- name: phone_credits
  description: Separate phone-credit balance returned by GET /v2/credits/balance.
  unit: credit
  aggregation: sum
- name: daily_request_allowance
  description: Requests remaining against the daily rate limit (dailyLimitRateLeft).
  unit: request
  aggregation: min
principles:
- name: Visibility
  description: >-
    Poll GET /v2/credits/balance for credits, emailCredits, phoneCredits and dailyLimitRateLeft;
    it is the only runtime cost signal the API exposes.
- name: Allocation
  description: Allocate seats and credits to ABM/RevOps teams.
- name: Optimization
  description: >-
    Use Lookup over Search when domains are known (0.05 vs 0.2 per result); probe with size:1 before
    a large search; call the free Warmup before batch enrichment; treat phone reveal (10 credits) as
    an exception path, not a default.
- name: Accountability
  description: RevOps owns the contract.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
