description: >-
  Ocean.io publishes NO first-party client library in any language. Its documentation teaches the API
  with raw curl, requests and fetch snippets only, and there is no SDK page, no GitHub organisation
  and no packages under an Ocean.io-controlled registry namespace that wrap the API. Everything below
  is third-party, written by other companies against Ocean.io's API; none is endorsed by or
  attributable to Ocean.io. The only npm namespace that plausibly belongs to the company —
  @oceanio — contains a design-system package, not an API client, and carries no repository,
  homepage or description to confirm ownership.
