  /v3/search/companies/preview:
    post:
      tags:
      - Search
      summary: Preview - Lookalike companies
      description: "Preview search companies using filters. \n **Only available for enterprise API customers.**"
      operationId: previewSearchCompaniesV3
      parameters:
      - name: apiToken
        in: query
        required: false
        schema:
