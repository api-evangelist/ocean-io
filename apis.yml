apis:
  - name: Ocean.io API
    description: >-
      REST API for B2B company and people intelligence — 26 operations across search (v2 and v3
      filter and lookalike search for companies and people), enrichment (single and batch, by domain
      or LinkedIn handle), lookup, contact reveal (verified email and phone, delivered by webhook),
      autocomplete of filter values, segmentation, and account operations (credit balance, data
      fields, warmup). Authenticated with an account API token in the X-Api-Token header, metered
      from a shared credit pool, cursor-paginated with searchAfter.
