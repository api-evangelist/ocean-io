name: Ocean.io
kind: company
description: >-
  Ocean.io is a B2B go-to-market data platform built around lookalike intelligence: give it a domain
  or a set of closed-won customers and it returns the most similar companies from a database of 67M
  company profiles and 250M+ employee records, each carrying 100+ signals assembled from the open
  web. Alongside the web app it ships a public REST API at api.ocean.io covering company and people
  search (filter, Boolean and lookalike), company and person enrichment, domain and LinkedIn-handle
  lookup, verified email and phone reveal, autocomplete for filter values, and a stateful
  segmentation service that clusters a customer list into scored segments and attributes new domains
  to the closest one. The API is documented with a public OpenAPI 3.1 document, meters every call
  from a single credit pool, delivers batch and reveal results by webhook callback, and is also
  exposed to agents through a first-party hosted MCP server at api.ocean.io/mcp.
